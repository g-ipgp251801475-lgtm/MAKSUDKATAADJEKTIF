<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apa Itu Kata Adjektif? | Jom Belajar</title>
<style>
:root{--blue:#245477;--ink:#365970;--sky:#dff3ff;--cream:#fff8e8;--yellow:#ffe6a5;--orange:#ffb17d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;background:linear-gradient(135deg,#e5f5ff 0%,#f8fcff 54%,#fff3dd 100%);font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink)}
.stage{width:min(1080px,100%);position:relative;overflow:hidden;border:6px solid white;border-radius:30px;background:#f8fcff;padding:clamp(20px,4vw,44px);box-shadow:0 18px 45px #24547720}
.blob{position:absolute;border-radius:50%;pointer-events:none;opacity:.65}.b1{width:220px;height:220px;background:#c9edff;right:-85px;top:-110px}.b2{width:175px;height:175px;background:#ffe7ad;left:-90px;bottom:-100px}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{background:#e8f7ff;border:1px solid #c7eafa;border-radius:30px;padding:8px 13px;color:var(--blue);font-size:12px;font-weight:900;letter-spacing:1px}
h1{position:relative;z-index:2;text-align:center;color:var(--blue);font-size:clamp(30px,5vw,56px);line-height:1.1;margin:27px 0 5px;opacity:0;transform:translateY(-18px);animation:titleIn .7s .2s forwards}
.sub{text-align:center;color:#66879c;font-weight:700;margin:0 0 8px;opacity:0;animation:fade .6s .8s forwards}
.content{position:relative;z-index:3;margin-top:132px;background:white;border:2px solid #d8eff9;border-radius:24px;padding:30px clamp(18px,3.5vw,32px) 28px;box-shadow:0 12px 28px #24547712;opacity:0;transform:translateY(18px);animation:fade .7s 2s forwards}
.cast-layer{position:absolute;z-index:1;left:8%;right:8%;top:190px;height:220px;display:flex;align-items:flex-end;justify-content:center;gap:clamp(18px,6vw,78px);pointer-events:none}
.char{width:clamp(112px,15vw,165px);height:205px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 5px 5px #24445a18);opacity:0;transform-origin:50% 94%;animation:charPop .65s both,sway 3.2s 1.7s ease-in-out infinite}
.char.left{animation-delay:1.05s,1.8s}.char.center{animation-delay:1.3s,2.15s}.char.right{animation-delay:1.55s,2.5s}
.speech{position:absolute;right:2%;top:2px;background:#fff;border:2px solid #bfe6f7;border-radius:16px;padding:8px 13px;font-size:13px;font-weight:900;color:var(--blue);box-shadow:0 5px 14px #24547712;opacity:0;animation:fade .5s 1.9s forwards}
.heading{display:flex;justify-content:center;align-items:center;gap:11px;color:var(--blue);font-size:clamp(21px,3vw,28px);font-weight:900;margin-bottom:14px}
.bulb{width:44px;height:44px;display:grid;place-items:center;background:#fff2c8;border-radius:14px;font-size:24px;flex:none}
.definition{text-align:center;font-size:clamp(17px,2.2vw,22px);line-height:1.8;font-weight:800;min-height:4.5em;color:#365970}
.word{display:inline-block;opacity:0;transform:translateY(9px);animation:wordIn .38s forwards;white-space:pre}
.examples{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.ex{border:1px solid #d9edf5;border-radius:16px;padding:12px 6px;text-align:center;opacity:0;transform:scale(.8);animation:pop .5s forwards}
.ex:nth-child(1){background:#eef8ff;animation-delay:5.2s}.ex:nth-child(2){background:#fff7e5;animation-delay:5.45s}.ex:nth-child(3){background:#fff0e9;animation-delay:5.7s}.ex:nth-child(4){background:#f1f4ff;animation-delay:5.95s}
.emoji{display:block;font-size:38px;margin-bottom:4px}.ex strong{font-size:13px;color:var(--blue)}.ex small{display:block;color:#718b9b;font-size:11px;margin-top:4px}

.examples{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.flip-card{height:142px;min-width:0;border:0;padding:0;background:transparent;perspective:900px;cursor:pointer;color:inherit;font:inherit}
.flip-inner{display:block;position:relative;width:100%;height:100%;text-align:center;transition:transform .65s cubic-bezier(.2,.75,.25,1);transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;border:1px solid #d9edf5;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:10px 5px;box-shadow:0 4px 10px #24547708}
.flip-face.front{background:#eef8ff}.flip-card:nth-child(2) .front{background:#fff7e5}.flip-card:nth-child(3) .front{background:#fff0e9}.flip-card:nth-child(4) .front{background:#f1f4ff}
.flip-face.back{background:#fff;border:2px solid #bfe6f7;transform:rotateY(180deg)}
.flip-face strong{font-size:13px;color:var(--blue);margin-top:3px}.flip-face .example-word{font-size:clamp(23px,3vw,32px);letter-spacing:.3px;margin:0}
.flip-face small{display:block;color:#718b9b;font-size:11px;margin-top:5px}
.flip-face em{font-style:normal;color:#8aa0ae;font-size:10px;margin-top:7px}
.flip-face .emoji{display:block;font-size:35px;margin-bottom:2px}
.flip-card:focus-visible{outline:3px solid #5caed4;outline-offset:4px;border-radius:18px}
.footer{text-align:center;color:#7893a3;font-size:12px;font-weight:700;margin:16px 0 0;opacity:0;animation:fade .5s 6.3s forwards}
.replay{display:block;margin:17px auto 0;border:0;border-radius:30px;padding:12px 20px;background:var(--blue);color:white;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 4px 0 #173c59;position:relative;z-index:5}
@keyframes titleIn{to{opacity:1;transform:translateY(0)}}@keyframes fade{to{opacity:1;transform:translateY(0)}}@keyframes charPop{from{opacity:0;translate:0 22px}to{opacity:1;translate:0 0}}@keyframes sway{0%,100%{transform:rotate(-5deg) translateY(0)}25%{transform:rotate(0deg) translateY(-7px)}50%{transform:rotate(5deg) translateY(0)}75%{transform:rotate(0deg) translateY(-5px)}}@keyframes pop{to{opacity:1;transform:scale(1)}}@keyframes wordIn{to{opacity:1;transform:translateY(0)}}
@media(max-width:650px){
body{padding:7px}
.stage{padding:17px 12px}
.content{margin-top:112px;padding:28px 14px 20px}
.cast-layer{left:4%;right:4%;top:165px;height:220px;gap:clamp(8px,3vw,22px)}
.char{width:clamp(88px,24vw,125px);height:205px}
.speech{right:0;top:-24px;font-size:11px}
.examples{grid-template-columns:repeat(2,1fr)}
.flip-card{height:136px}
.definition{min-height:unset}
}
@media(hover:hover) and (pointer:fine){
.flip-card:hover .flip-inner{transform:rotateY(180deg)}
.flip-card:hover .flip-face.back{pointer-events:auto}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important}}
</style></head>

<script>
const sentence="Kata adjektif ialah perkataan yang digunakan untuk menerangkan sifat atau keadaan seseorang, haiwan, benda atau tempat.";
function showWords(){const el=document.getElementById("definition");el.innerHTML="";const words=sentence.split(" ");words.forEach((w,i)=>{const s=document.createElement("span");s.className="word";s.textContent=w+(i===words.length-1?"":" ");s.style.animationDelay=(2.75+i*.105)+"s";el.appendChild(s);});}
function replay(){document.querySelectorAll("h1,.sub,.char,.speech,.content,.ex,.footer").forEach(e=>{e.style.animation="none";void e.offsetWidth;e.style.animation="";});showWords();}
showWords();
document.getElementById("replay").addEventListener("click",replay);
const cards = [...document.querySelectorAll(".flip-card")];
const touchMode = window.matchMedia("(hover: none), (pointer: coarse)").matches;
if (touchMode) {
  cards.forEach(card => card.addEventListener("click", event => {
    event.stopPropagation();
    const wasFlipped = card.classList.contains("flipped");
    cards.forEach(item => { item.classList.remove("flipped"); item.setAttribute("aria-pressed","false"); });
    if (!wasFlipped) { card.classList.add("flipped"); card.setAttribute("aria-pressed","true"); }
  }));
  document.addEventListener("click", () => {
    cards.forEach(card => { card.classList.remove("flipped"); card.setAttribute("aria-pressed","false"); });
  });
} else {
  cards.forEach(card => {
    card.addEventListener("mouseenter", () => { card.classList.add("flipped"); card.setAttribute("aria-pressed","true"); });
    card.addEventListener("mouseleave", () => { card.classList.remove("flipped"); card.setAttribute("aria-pressed","false"); });
    card.addEventListener("focus", () => { card.classList.add("flipped"); card.setAttribute("aria-pressed","true"); });
    card.addEventListener("blur", () => { card.classList.remove("flipped"); card.setAttribute("aria-pressed","false"); });
  });
}
</script></body></html>
